name: Build image level
# Reusable workflow: build + publish one dependency level of the image graph.
# Driven entirely by per-folder metadata (see .github/scripts/read-image-config.sh);
# no image names are hardcoded here.
on:
  workflow_call:
    inputs:
      matrix:
        description: JSON array of {folder, arch, platform} build entries for this level.
        required: true
        type: string
      folders:
        description: JSON array of folder names in this level (merge matrix).
        required: true
        type: string
      x64_self_hosted:
        description: Run amd64 legs on org self-hosted runner ([self-hosted, Linux, X64]).
        required: false
        type: boolean
        default: false
      arm64_self_hosted:
        description: Run arm64 legs on org self-hosted runner ([self-hosted, Linux, ARM64]).
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: Rebuild resource-tracker consumers without registry cache.
        required: false
        type: boolean
        default: false
env:
  REGISTRY: ghcr.io
  ZRAM_PERCENT: "125"
  # RAM-linear compile parallelism reference (64 GiB self-hosted arm64 builder).
  REFERENCE_RAM_GIB: "64"
  VLLM_COMPILE_GIB_PER_SLOT: "3"
  VLLM_MAX_JOBS_CAP: "32"
  VLLM_NVCC_THREADS: "2"
  CARGO_BUILD_JOBS_CAP: "32"
  ZRAM_COMPILE_BUDGET_PERCENT: "50"
  BUILDKIT_MAX_PARALLELISM_CAP: "16"
jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ inputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && (inputs.arm64_self_hosted && fromJson('["self-hosted", "Linux", "ARM64"]') || 'ubuntu-24.04-arm') || (inputs.x64_self_hosted && fromJson('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    env:
      TRACKER_PROJECT_NAME: sc-images
      TRACKER_ORCHESTRATOR: github-actions
      TRACKER_ENV: ci
      TRACKER_QUIET: "true"
      TRACKER_EXTERNAL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TRACKER_JOB_NAME: ${{ matrix.name }}
      TRACKER_TASK_NAME: ${{ matrix.folder }}
      TRACKER_STAGE_NAME: ${{ github.workflow }}
      TRACKER_CONTAINER_IMAGE: ghcr.io/sparecores/${{ matrix.folder }}:main-${{ matrix.arch }}
      SENTINEL_API_TOKEN: ${{ secrets.SENTINEL_API_TOKEN }}
    steps:
      # Prepare hooks hand the build context to BuildKit root-owned so its cache
      # key matches across runner types. Persistent runners must take the tree
      # back before actions/checkout runs `git clean -ffdx`.
      - name: Reclaim workspace ownership
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          ws='${{ github.workspace }}'
          [ -d "$ws" ] || exit 0
          sudo -n chown -R "$(id -u):$(id -g)" "$ws" 2>/dev/null || true
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Resolve image config
        id: cfg
        run: bash "${{ github.workspace }}/.github/scripts/read-image-config.sh" "${{ matrix.folder }}" "${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - name: Install resource-tracker
        run: bash "${{ github.workspace }}/.github/scripts/install-resource-tracker.sh"
      - name: Set up zram swap
        if: ${{ steps.cfg.outputs.zram == 'true' }}
        env:
          ZRAM_PERCENT: ${{ steps.cfg.outputs.zram_percent }}
        run: bash "${{ github.workspace }}/.github/scripts/setup-zram.sh"
      - name: Configure AWS credentials for sccache
        if: ${{ steps.cfg.outputs.sccache == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.SC_IMAGES_GHA_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - name: Stage AWS credentials for BuildKit
        if: ${{ steps.cfg.outputs.sccache == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          {
            echo '[default]'
            echo "aws_access_key_id=${AWS_ACCESS_KEY_ID}"
            echo "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}"
            echo "aws_session_token=${AWS_SESSION_TOKEN}"
          } > .cache/aws-credentials
      - name: Run prepare hook
        id: prep
        if: ${{ steps.cfg.outputs.has_prepare == 'true' }}
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_FOLDER: ${{ matrix.folder }}
          SCCACHE_ENABLED: ${{ steps.cfg.outputs.sccache }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
          SCCACHE_PREFIX: ${{ matrix.folder }}/${{ matrix.arch }}
        run: bash "${{ github.workspace }}/images/${{ matrix.folder }}/prepare.sh"
      - name: Compute BuildKit parallelism (self-hosted arm64)
        id: bk
        if: ${{ matrix.arch == 'arm64' && steps.cfg.outputs.has_prepare != 'true' && inputs.arm64_self_hosted }}
        env:
          VLLM_COMPILE_GIB_PER_SLOT: "2"
        run: bash "${{ github.workspace }}/.github/scripts/compute-build-parallelism.sh" buildkit >> "$GITHUB_OUTPUT"
      - name: Assemble BuildKit config
        id: bxcfg
        run: |
          par='${{ steps.prep.outputs.buildkit_max_parallelism || steps.bk.outputs.buildkit_max_parallelism }}'
          if [ -n "$par" ]; then
            {
              echo 'config<<EOF'
              echo '[worker.oci]'
              echo "  max-parallelism = ${par}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble build args
        id: bargs
        run: |
          : > .cache/all-build-args
          [ -f .cache/build-args ] && cat .cache/build-args >> .cache/all-build-args || true
          [ -f .cache/extra-build-args ] && cat .cache/extra-build-args >> .cache/all-build-args || true
          if [ -s .cache/all-build-args ]; then
            {
              echo 'args<<EOF'
              cat .cache/all-build-args
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to the Container registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
        with:
          buildkitd-config-inline: ${{ steps.bxcfg.outputs.config }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/sparecores/${{ matrix.folder }}
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=false
      - name: Assemble BuildKit cache backends
        id: cache
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          bash "${{ github.workspace }}/.github/scripts/assemble-build-cache.sh" \
            "${{ matrix.folder }}" \
            "${{ matrix.arch }}" \
            "${{ steps.cfg.outputs.rt_consumer }}" \
            "${{ steps.cfg.outputs.has_prepare }}" \
            "${{ inputs.force_rebuild }}"
      - name: Build and push Docker image
        env:
          BUILD_CONTEXT: ${{ github.workspace }}/${{ steps.cfg.outputs.context }}
          BUILD_DOCKERFILE: ${{ github.workspace }}/${{ steps.cfg.outputs.dockerfile }}
          BUILD_TARGET: ${{ steps.cfg.outputs.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_LABELS: ${{ steps.meta.outputs.labels }}
          BUILD_PULL: ${{ steps.cfg.outputs.pull }}
          BUILD_NO_CACHE: ${{ inputs.force_rebuild && steps.cfg.outputs.rt_consumer == 'true' }}
          BUILD_PROVENANCE_FALSE: ${{ steps.cfg.outputs.has_prepare == 'true' }}
          BUILD_ARGS_FILE: ${{ github.workspace }}/.cache/all-build-args
          BUILD_SECRET: ${{ steps.prep.outputs.secret_file && format('id=vllm_parallelism,src={0}/{1}', github.workspace, steps.prep.outputs.secret_file) || '' }}
          BUILD_AWS_SECRET: ${{ steps.cfg.outputs.sccache == 'true' && format('id=aws-credentials,src={0}/.cache/aws-credentials', github.workspace) || '' }}
          BUILD_CACHE_FROM: ${{ steps.cache.outputs.cache_from }}
          BUILD_CACHE_TO: ${{ steps.cache.outputs.cache_to }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: bash "${{ github.workspace }}/.github/scripts/build-push-image.sh"

  merge:
    name: Merge manifest (${{ matrix.folder }})
    needs: build
    # Run even when some matrix builds fail: each folder merges independently,
    # so unrelated arm64 failures must not block promoting amd64-only images.
    if: ${{ !cancelled() && needs.build.result != 'cancelled' && inputs.folders != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(inputs.folders) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Resolve image config
        id: cfg
        run: bash "${{ github.workspace }}/.github/scripts/read-image-config.sh" "${{ matrix.folder }}" amd64 >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/sparecores/${{ matrix.folder }}
      - name: Create manifest from per-arch images
        env:
          PLATFORMS: ${{ steps.cfg.outputs.platforms }}
        run: |
          set -euo pipefail
          sources=()
          for p in $PLATFORMS; do
            sources+=("$p")
          done
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            refs=()
            missing=0
            for arch in "${sources[@]}"; do
              ref="${tag}-${arch}"
              if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
                echo "Skipping ${tag}: missing ${ref}"
                missing=1
                break
              fi
              refs+=("$ref")
            done
            if [ "$missing" -ne 0 ]; then
              continue
            fi
            echo "Creating ${tag} from: ${refs[*]}"
            docker buildx imagetools create --tag "$tag" "${refs[@]}"
          done <<< "${{ steps.meta.outputs.tags }}"
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${{ github.workspace }}/.github/scripts/set-package-public.sh" "${{ github.repository_owner }}" "${{ matrix.folder }}"
